<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk — Selaras Wedding Planner</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --ivory:#FAF6EF;
    --sage:#5C6B54;
    --sage-dark:#3E4A38;
    --gold:#B08D4F;
    --blush:#E3C9BE;
    --charcoal:#2B2723;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    font-family:'Jost', sans-serif;
    color:var(--charcoal);
    background:var(--ivory);
    font-weight:300;
    letter-spacing:.01em;
    min-height:100vh;
  }
  h1,h2,h3{ font-family:'Cormorant Garamond', serif; font-weight:600; }
  .eyebrow{
    font-size:.72rem; letter-spacing:.32em; text-transform:uppercase;
    color:var(--gold); font-weight:500;
  }

  .auth-wrap{ min-height:100vh; }

  /* Left decorative panel */
  .auth-side{
    background:var(--sage-dark);
    color:var(--ivory);
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:3.5rem 3rem;
    position:relative;
    overflow:hidden;
  }
  .auth-side .ring{
    position:absolute; border:1px solid rgba(227,201,190,.25); border-radius:50%;
  }
  .auth-side .ring1{ width:420px; height:420px; top:-140px; right:-140px; }
  .auth-side .ring2{ width:260px; height:260px; bottom:-100px; left:-80px; border-color:rgba(176,141,79,.3); }

  .brand-logo{ width:44px; height:44px; }
  .brand-row{ display:flex; align-items:center; gap:.7rem; position:relative; z-index:1; }
  .brand-name{ font-family:'Cormorant Garamond', serif; font-size:1.5rem; }

  .auth-quote{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:1.9rem;
    line-height:1.35;
    max-width:420px;
    position:relative; z-index:1;
  }
  .auth-side .small-note{ opacity:.7; font-size:.85rem; position:relative; z-index:1; }

  /* Right form panel */
  .auth-form-panel{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:3rem 1.5rem;
  }
  .auth-card{ width:100%; max-width:400px; }

  .form-control{
    border-radius:0;
    border:1px solid rgba(0,0,0,.15);
    padding:.75rem 1rem;
    background:transparent;
  }
  .form-control:focus{
    border-color:var(--gold);
    box-shadow:0 0 0 .15rem rgba(176,141,79,.2);
  }
  label{ font-size:.78rem; letter-spacing:.06em; text-transform:uppercase; color:var(--sage-dark); margin-bottom:.35rem; }

  .btn-gold{
    background:var(--gold); border:1px solid var(--gold); color:#fff;
    padding:.8rem 2.1rem; font-size:.85rem; letter-spacing:.1em;
    text-transform:uppercase; border-radius:0; transition:all .3s ease;
  }
  .btn-gold:hover{ background:transparent; color:var(--gold); }

  .divider-text{
    display:flex; align-items:center; gap:1rem;
    color:var(--charcoal); opacity:.5; font-size:.78rem;
    text-transform:uppercase; letter-spacing:.1em;
  }
  .divider-text::before, .divider-text::after{
    content:""; flex:1; height:1px; background:rgba(0,0,0,.15);
  }

  .btn-social{
    border:1px solid rgba(0,0,0,.15);
    background:transparent;
    padding:.65rem 1rem;
    border-radius:0;
    font-size:.85rem;
    color:var(--charcoal);
    transition:all .25s ease;
    width:100%;
  }
  .btn-social:hover{ border-color:var(--sage-dark); background:rgba(92,107,84,.05); }

  .form-check-input{ border-radius:0; border-color:rgba(0,0,0,.25); }
  .form-check-input:checked{ background-color:var(--gold); border-color:var(--gold); }

  a.link-gold{ color:var(--gold); text-decoration:none; }
  a.link-gold:hover{ text-decoration:underline; }

  .toggle-pw{
    cursor:pointer; position:absolute; right:14px; top:38px; opacity:.55; font-size:1rem;
  }
  .pw-wrap{ position:relative; }

  @media (max-width: 767.98px){
    .auth-side{ padding:2.5rem 1.75rem; min-height:260px; }
    .auth-quote{ font-size:1.4rem; }
  }
</style>
</head>
<body>

<div class="container-fluid p-0">
  <div class="row g-0 auth-wrap">

    <!-- Left panel -->
    <div class="col-md-5 auth-side">
      <div class="ring ring1"></div>
      <div class="ring ring2"></div>

      <div class="brand-row">
        <svg class="brand-logo" viewBox="0 0 120 120" aria-hidden="true">
          <circle cx="60" cy="60" r="42" fill="none" stroke="#E3C9BE" stroke-width="1.4"/>
          <circle cx="60" cy="60" r="37.5" fill="none" stroke="#B08D4F" stroke-width="1"/>
          <g fill="none" stroke="#E3C9BE" stroke-width="1.6" stroke-linecap="round">
            <path d="M26,72 C19,64 19,50 26,40"/>
            <path d="M94,72 C101,64 101,50 94,40"/>
          </g>
          <text x="60" y="72" text-anchor="middle" font-family="Cormorant Garamond, serif" font-style="italic" font-weight="600" font-size="38" fill="#FAF6EF">S</text>
        </svg>
        <span class="brand-name">Selaras Wedding</span>
      </div>

      <p class="auth-quote">
        "Masuk kembali untuk melanjutkan<br>merangkai hari bahagia kalian."
      </p>

      <p class="small-note mb-0">&copy; 2026 Selaras Wedding Planner</p>
    </div>

    <!-- Right panel: form -->
    <div class="col-md-7 auth-form-panel">
      <div class="auth-card">
        <span class="eyebrow">Selamat Datang</span>
        <h1 class="mt-2 mb-1" style="font-size:2.2rem;">Masuk ke Akun</h1>
        <p class="mb-4" style="opacity:.75; font-size:.92rem;">
          Belum punya akun? <a href="register.html" class="link-gold">Daftar di sini</a>
        </p>

        <form onsubmit="window.location.href='wo-clients.html'; return false;">
          <div class="mb-3">
            <label for="email">Email</label>
            <input type="email" class="form-control" id="email" placeholder="nama@email.com" required>
          </div>

          <div class="mb-2 pw-wrap">
            <label for="password">Kata Sandi</label>
            <input type="password" class="form-control" id="password" placeholder="••••••••" required>
            <i class="bi bi-eye toggle-pw" onclick="togglePw('password', this)"></i>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-4 mt-3">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="remember">
              <label class="form-check-label" for="remember" style="text-transform:none; letter-spacing:normal; font-size:.85rem;">Ingat saya</label>
            </div>
            <a href="#" class="link-gold" style="font-size:.85rem;">Lupa kata sandi?</a>
          </div>

          <button type="submit" class="btn btn-gold w-100 mb-4">Masuk</button>

          <div class="divider-text mb-4">atau lanjutkan dengan</div>

          <div class="row g-2 mb-4">
            <div class="col-6">
              <button type="button" class="btn btn-social"><i class="bi bi-google me-2"></i>Google</button>
            </div>
            <div class="col-6">
              <button type="button" class="btn btn-social"><i class="bi bi-facebook me-2"></i>Facebook</button>
            </div>
          </div>

          <p class="text-center mb-0" style="font-size:.85rem;">
            <a href="index.html" class="link-gold"><i class="bi bi-arrow-left me-1"></i>Kembali ke beranda</a>
          </p>
        </form>
      </div>
    </div>

  </div>
</div>

<script>
  function togglePw(id, el){
    const input = document.getElementById(id);
    if(input.type === 'password'){
      input.type = 'text';
      el.classList.remove('bi-eye');
      el.classList.add('bi-eye-slash');
    } else {
      input.type = 'password';
      el.classList.remove('bi-eye-slash');
      el.classList.add('bi-eye');
    }
  }
</script>
</body>
</html>
