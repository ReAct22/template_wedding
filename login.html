<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Masuk — Selaras Wedding Planner</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Jost:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/css/login.css" />
  </head>
  <body>
    <div class="container-fluid p-0">
      <div class="row g-0 auth-wrap">
        <!-- Left panel -->
        <div class="col-md-5 auth-side">
          <div class="ring ring1"></div>
          <div class="ring ring2"></div>

          <div class="brand-row">
            <svg class="brand-logo" viewBox="0 0 120 120" aria-hidden="true">
              <circle
                cx="60"
                cy="60"
                r="42"
                fill="none"
                stroke="#E3C9BE"
                stroke-width="1.4"
              />
              <circle
                cx="60"
                cy="60"
                r="37.5"
                fill="none"
                stroke="#B08D4F"
                stroke-width="1"
              />
              <g
                fill="none"
                stroke="#E3C9BE"
                stroke-width="1.6"
                stroke-linecap="round"
              >
                <path d="M26,72 C19,64 19,50 26,40" />
                <path d="M94,72 C101,64 101,50 94,40" />
              </g>
              <text
                x="60"
                y="72"
                text-anchor="middle"
                font-family="Cormorant Garamond, serif"
                font-style="italic"
                font-weight="600"
                font-size="38"
                fill="#FAF6EF"
              >
                S
              </text>
            </svg>
            <span class="brand-name">Selaras Wedding</span>
          </div>

          <p class="auth-quote">
            "Masuk kembali untuk melanjutkan<br />merangkai hari bahagia
            kalian."
          </p>

          <p class="small-note mb-0">&copy; 2026 Selaras Wedding Planner</p>
        </div>

        <!-- Right panel: form -->
        <div class="col-md-7 auth-form-panel">
          <div class="auth-card">
            <span class="eyebrow">Selamat Datang</span>
            <h1 class="mt-2 mb-1" style="font-size: 2.2rem">Masuk ke Akun</h1>
            <p class="mb-4" style="opacity: 0.75; font-size: 0.92rem">
              Belum punya akun?
              <a href="register.html" class="link-gold">Daftar di sini</a>
            </p>

            <form
              onsubmit="
                window.location.href = 'wo-clients.html';
                return false;
              "
            >
              <div class="mb-3">
                <label for="email">Email</label>
                <input
                  type="email"
                  class="form-control"
                  id="email"
                  placeholder="nama@email.com"
                  required
                />
              </div>

              <div class="mb-2 pw-wrap">
                <label for="password">Kata Sandi</label>
                <input
                  type="password"
                  class="form-control"
                  id="password"
                  placeholder="••••••••"
                  required
                />
                <i
                  class="bi bi-eye toggle-pw"
                  onclick="togglePw('password', this)"
                ></i>
              </div>

              <div
                class="d-flex justify-content-between align-items-center mb-4 mt-3"
              >
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="remember"
                  />
                  <label
                    class="form-check-label"
                    for="remember"
                    style="
                      text-transform: none;
                      letter-spacing: normal;
                      font-size: 0.85rem;
                    "
                    >Ingat saya</label
                  >
                </div>
                <a href="#" class="link-gold" style="font-size: 0.85rem"
                  >Lupa kata sandi?</a
                >
              </div>

              <button type="submit" class="btn btn-gold w-100 mb-4">
                Masuk
              </button>

              <div class="divider-text mb-4">atau lanjutkan dengan</div>

              <div class="row g-2 mb-4">
                <div class="col-6">
                  <button type="button" class="btn btn-social">
                    <i class="bi bi-google me-2"></i>Google
                  </button>
                </div>
                <div class="col-6">
                  <button type="button" class="btn btn-social">
                    <i class="bi bi-facebook me-2"></i>Facebook
                  </button>
                </div>
              </div>

              <p class="text-center mb-0" style="font-size: 0.85rem">
                <a href="index.html" class="link-gold"
                  ><i class="bi bi-arrow-left me-1"></i>Kembali ke beranda</a
                >
              </p>
            </form>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/landing.js"></script>
  </body>
</html>
